name: CI

# Runs on every push and PR so a broken build is caught here rather than
# discovered during a deploy. Deploys are manual from EasyPanel, so this is
# purely a gate on the code, not a release pipeline.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The build needs these at compile time (NEXT_PUBLIC_* are inlined into
      # the bundle). They are placeholders — CI only proves the code compiles,
      # it never talks to the real database.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_URL: https://app.metrikas.pro
